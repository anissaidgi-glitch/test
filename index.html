<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inox Style – Bijoux en acier inoxydable</title>
  <style>
    body {font-family: Arial, sans-serif; margin:0; background:#f7f7f7; color:#222}
    header {background:#111; color:#fff; padding:20px}
    header h1 {margin:0}
    nav a {color:#fff; margin-right:15px; text-decoration:none}
    .container {max-width:1100px; margin:auto; padding:20px}
    .products {display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px}
    .card {background:#fff; border-radius:8px; padding:15px; box-shadow:0 2px 6px rgba(0,0,0,.1)}
    .card img {width:100%; border-radius:6px}
    .price {font-weight:bold; margin:10px 0}
    button {background:#111; color:#fff; border:none; padding:10px 15px; cursor:pointer; border-radius:5px}
    footer {background:#111; color:#fff; text-align:center; padding:15px; margin-top:40px}
  </style>
</head>
<body>
  <header>
    <h1>Inox Style</h1>
    <nav>
      <a href="#">Accueil</a>
      <a href="#">Chaînes</a>
      <a href="#">Bracelets</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <div class="container">
    <h2>Nos accessoires en acier inoxydable</h2>
    <div class="products">
      <div class="card">
        <img src="https://via.placeholder.com/300x300" alt="Chaîne inox" />
        <h3>Chaîne classique</h3>
        <p class="price">199 MAD</p>
        <button>Commander</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/300x300" alt="Bracelet inox" />
        <h3>Bracelet moderne</h3>
        <p class="price">149 MAD</p>
        <button>Commander</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 Inox Style – Bijoux en acier inoxydable</p>
  </footer>
</body>
</html>
